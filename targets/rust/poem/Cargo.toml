[package]
name = "rb-poem"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Named per target rather than "server": six crates writing one binary into the shared
# target directory made cargo relink on every switch, which local mode does per boot.
[[bin]]
name = "rb-poem"
path = "src/main.rs"

[dependencies]
rb-domain = { workspace = true }
rb-host = { workspace = true }
mimalloc = { workspace = true }
askama = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# sonic-rs is the feature poem documents for replacing serde_json in its Json extractor and
# responder.
poem = { version = "3", features = ["compression", "sonic-rs"] }

# The suite in src/suite. The standard library has no gzip decoder and the floor has to undo
# gzip before it compares, so the suite takes flate2.
# The framework again with its test feature on, which is where its TestClient lives. A
# dev-dependency's features reach a test build and no other.
[dev-dependencies]
flate2 = { workspace = true }
poem = { version = "3", features = ["compression", "test"] }
