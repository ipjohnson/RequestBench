# One workspace, one lockfile, one target directory. Every target resolves the same
# version of every shared dependency, so a difference between two of them is the framework
# and not a transitive bump one of them happened to pick up.
[workspace]
resolver = "3"
members = ["_shared", "_hosts", "axum", "actix-web", "poem", "salvo", "rocket", "warp"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
rb-domain = { path = "_shared" }
rb-host = { path = "_hosts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
askama = "0.16"
flate2 = "1"
# The digest for the etag family. Salvo's own caching middleware brings one; the other five
# frameworks ship none, so the targets hash with this and declare it in /__meta.
sha1 = "0.10"
# The global allocator of every target, in place of glibc's malloc. It is a runtime
# setting, so all six take it or none do.
mimalloc = "0.1"

# Measurement, not development. Without this every target is compared while carrying
# debug assertions and no inlining across crates, which measures the profile rather than
# the framework.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
