[package]
name = "rb-warp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Named per target rather than "server": six crates writing one binary into the shared
# target directory made cargo relink on every switch, which local mode does per boot.
[[bin]]
name = "rb-warp"
path = "src/main.rs"

[dependencies]
rb-domain = { workspace = true }
rb-host = { workspace = true }
askama = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# The compression module is re-exported behind the umbrella `compression` feature, so
# brotli comes along with gzip. Nothing negotiates it: the compressed arms send
# `accept-encoding: gzip` or `identity` and nothing else.
warp = { version = "0.3", features = ["compression"] }
bytes = "1"
