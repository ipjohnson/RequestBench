# Filtered at build time from the parent pom's <properties>. Every value here is a pin the
# nightly deps job moves, so /__meta and the trend chart's version ring read the same
# number the build resolved.
netty=${netty.version}
javalin=${javalin.version}
vertx=${vertx.version}
helidon=${helidon.version}
spring-boot=${spring-boot.version}
micronaut=${micronaut.version}
quarkus=${quarkus.version}
jackson=${jackson.version}
jmustache=${jmustache.version}
gcp-functions=${gcp-functions.version}
aws-lambda-core=${aws-lambda-core.version}
aws-serverless-container=${aws-serverless-container.version}
