# Tomcat's own compression, on the whole connector. Neither Spring Boot nor Tomcat has a
# setting for the level, so Tomcat gzips at the JDK's default, which zlib runs as 6. It holds
# back a body under server.compression.min-response-size, 2 KB by default, only when it knows
# the length before the headers go out, and Spring writes JSON without one.
# rb:wiring compressed.*
server.compression.enabled=true

# Thymeleaf's SpEL compiler, off by default. Thymeleaf runs it in SpEL's mixed mode, which
# compiles an expression once it has been evaluated a hundred times and keeps interpreting
# any expression it cannot compile.
spring.thymeleaf.enable-spring-el-compiler=true
