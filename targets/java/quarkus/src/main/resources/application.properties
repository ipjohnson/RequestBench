# One runnable jar, matching every other target's target/server.jar.
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false
# The port comes from PORT, which is the variable the container contract names and every
# target in every language reads.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# Quarkus's own compression, off until this turns it on for the whole HTTP server. It gzips a
# response of any size whose type is in quarkus.http.compress-media-types, JSON among them by
# default, when the request asks for it. The level defaults to Vert.x's 6, and the fastest is 1.
# rb:wiring compressed.*
quarkus.http.enable-compression=true
quarkus.http.compression-level=1
# rb:end

# Quarkus REST generates a Jackson serializer and deserializer at build time for each type a
# resource method returns or takes, so Jackson does not reflect on them at run time. Quarkus
# calls this a Technology Preview.
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true
