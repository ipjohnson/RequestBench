# Micronaut omits empty collections and nulls by default. The node reference emits
# "items": [] rather than leaving the key out, and conform.py fingerprints the body, so
# the default drops two endpoints' response shape.
micronaut.serde.serialization.inclusion=ALWAYS
# Micronaut's Netty server compresses on its own, for every route, when the request asks for
# gzip and the body is at least micronaut.server.netty.compression-threshold, 1 KB by default.
# Its default level is 6, and the fastest is 1.
# rb:wiring compressed.*
micronaut.server.netty.compression-level=1
