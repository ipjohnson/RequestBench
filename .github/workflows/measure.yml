# Measurement on GitHub-hosted runners.
#
# Hosted hardware varies between runs, so nothing absolute here is comparable night to
# night. Every shard measures its own bare baseline in the same job, on the same machine,
# within the same few minutes, and publishes ratios to it. That is what survives a runner
# swap. Cross-language comparison does not survive it and is not attempted.
#
# Each shard gets its own runner, so there is no shared machine to serialize around and
# the shards run in parallel.
name: measure

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: JSON array of shards to measure.
        default: '["node","go"]'
        type: string
      seconds:
        description: Override rung duration in seconds. Empty means the full 60s rungs.
        default: ""
        type: string
      rungs:
        description: Comma separated rung numbers. Empty means all five.
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.shards || '["node","go"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the shard's targets
        id: rot
        run: |
          python3 harness/rotation.py --shard "${{ matrix.shard }}" --github-output \
            >> "$GITHUB_OUTPUT"
          python3 harness/rotation.py --shard "${{ matrix.shard }}"

      # A shortened ladder proves the wiring; it must never enter the tracked series.
      - name: Is this a full ladder?
        id: full
        run: |
          if [ -z "${{ github.event.inputs.seconds }}" ] && [ -z "${{ github.event.inputs.rungs }}" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "rung duration or rung set was overridden; this run is a smoke test"
          fi

      - name: Record the machine
        if: steps.rot.outputs.built != '0'
        run: |
          echo "cores: $(nproc)"
          grep -m1 "model name" /proc/cpuinfo || true
          echo "target pinned to cores 0,1 and the generator to 2,3"

      - name: Run the ladder
        if: steps.rot.outputs.built != '0'
        env:
          RB_CPUS: "2"
          RB_SUT_CPUS: "0,1"
          RB_GEN_CPUS: "2,3"
        run: |
          python3 harness/run.py \
            --shard "${{ matrix.shard }}" \
            --targets "${{ steps.rot.outputs.targets }}" \
            --mode docker \
            --workers 2 \
            --emit-path /tmp/rb-result-path \
            ${{ github.event.inputs.seconds && format('--seconds {0}', github.event.inputs.seconds) || '' }} \
            ${{ github.event.inputs.rungs && format('--rungs {0}', github.event.inputs.rungs) || '' }}

      - name: Summarize
        id: sum
        if: steps.rot.outputs.built != '0'
        run: |
          RAW=$(cat /tmp/rb-result-path)
          NAME=$(basename "$RAW" .jsonl)
          TRACKED=""
          [ "${{ steps.full.outputs.yes }}" = "true" ] && TRACKED="--tracked"
          # shellcheck disable=SC2086
          python3 harness/summarize.py "$RAW" $TRACKED \
            --runner github-hosted \
            --out "results/summary/$NAME.json"
          gzip -9 -c "$RAW" > "/tmp/$NAME.jsonl.gz"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          python3 harness/report.py "$RAW" --family

      - name: Upload raw samples
        if: steps.rot.outputs.built != '0'
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.sum.outputs.name }}
          path: /tmp/${{ steps.sum.outputs.name }}.jsonl.gz
          retention-days: 90

      - name: Upload summary
        if: steps.rot.outputs.built != '0' && steps.full.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.shard }}
          path: results/summary/*.json
          retention-days: 90

  collect:
    name: commit summaries
    needs: measure
    if: always() && needs.measure.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every shard's summary
        uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: /tmp/summaries
          merge-multiple: true

      - name: Commit them in one go
        shell: bash
        run: |
          shopt -s nullglob
          files=(/tmp/summaries/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no summaries produced; nothing to commit"
            exit 0
          fi
          mkdir -p results/summary
          cp "${files[@]}" results/summary/
          git config user.name  "requestbench"
          git config user.email "requestbench@users.noreply.github.com"
          git add results/summary
          if git diff --cached --quiet; then
            echo "no summary change"
            exit 0
          fi
          git commit -m "Record measurement summaries from run ${{ github.run_id }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
