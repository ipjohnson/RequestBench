# A one-off copy of measure.yml for this branch, which is never merged. It measures the .NET
# frameworks, Hardened among them, on container-h1 and lambda-emulator, and records nothing: the
# summaries and exemplars stay as this run's artifacts, and the results branch and the site are
# left alone. Its name differs from measure's, so pages.yml does not rebuild the site when it ends,
# and its concurrency group differs, so it neither waits for the nightly nor holds it up.
# Started with `gh workflow run measure.yml --ref measure/dotnet-hardened`.
name: measure .NET unrecorded

on:
  workflow_dispatch:

concurrency:
  group: measure-dotnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [container-h1, lambda-emulator]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The gate and the load go through the traffic generator's Rust program, which cargo builds
      # with the toolchain traffic-generator/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: traffic-generator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: traffic-generator
          shared-key: traffic-generator

      # Every framework's image is built in this one job, and the runner's preinstalled toolchains
      # leave too little disk for all of them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # A framework that fails its gate or its boot has an entry saying why, and the others are
      # still measured, so the run is summarized either way.
      - name: Measure
        id: measure
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          RB_SUT_CPUS: "0,1"
          RB_GEN_CPUS: "2,3"
        run: >-
          npm run rb -- measure
          dotnet:aspnet-mvc dotnet:carter dotnet:fastendpoints dotnet:hardened dotnet:minimal-apis dotnet:wolverine-http
          --host "$HOST" --ladder ci

      - name: Summarize
        id: summarize
        run: |
          file=$(ls results/runs/*.json)
          run=$(basename "$file" .json)
          npm run -s rb -- summarize "$file" --out "summary/$run.json"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: run-${{ steps.summarize.outputs.run }}
          path: results/runs/
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: summary-${{ matrix.host }}
          path: summary/
          retention-days: 90

      # A framework whose image did not build has none.
      - uses: actions/upload-artifact@v7
        with:
          name: exemplars-${{ matrix.host }}
          path: results/exemplars/
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail if a framework was not measured
        if: steps.measure.outcome == 'failure'
        run: |
          echo "::error::A framework was not measured on ${{ matrix.host }}. Its entry in the run file says why."
          exit 1
