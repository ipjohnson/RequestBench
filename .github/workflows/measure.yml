# Measures every framework on each host some framework implements. Each host is its own job on its
# own GitHub-hosted runner, and within a host the frameworks run one after another on that runner,
# so every number in a run was taken on the same machine. Each run's summary is added to the
# results branch under runs/<month>/, and pages.yml publishes the site when this finishes. A run
# started by hand can name one host, such as `gh workflow run measure.yml -f host=lambda-emulator`.
name: measure

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: The one host to measure, such as lambda-emulator. Empty measures every host.
        required: false
        default: ""

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  hosts:
    name: hosts to measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hosts: ${{ steps.pick.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      # Every host an rb.json names, so a host no framework implements yet gets no job, or the one
      # host a run started by hand names.
      - id: pick
        env:
          HOST: ${{ inputs.host }}
        run: |
          hosts=$(git ls-files -- ':(glob)frameworks/*/*/rb.json' | xargs -n1 jq -r '.hosts | keys[]' | sort -u | jq -Rnc '[inputs]')
          if [ -n "$HOST" ]; then
            hosts=$(jq -c --arg host "$HOST" 'map(select(. == $host))' <<< "$hosts")
            if [ "$hosts" = "[]" ]; then
              echo "::error::No framework implements $HOST."
              exit 1
            fi
          fi
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "Hosts to measure: $hosts"

  measure:
    name: ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The gate and the load go through the traffic generator's Rust program, which cargo builds
      # with the toolchain traffic-generator/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: traffic-generator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: traffic-generator
          shared-key: traffic-generator

      # Every framework's image is built in this one job, and the runner's preinstalled toolchains
      # leave too little disk for all of them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # A framework that fails its gate or its boot has an entry saying why, and the others are
      # still measured, so the run is summarized and recorded either way.
      - name: Measure
        id: measure
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          RB_SUT_CPUS: "0,1"
          RB_GEN_CPUS: "2,3"
        run: npm run rb -- measure --host "$HOST" --ladder ci

      - name: Summarize
        id: summarize
        run: |
          file=$(ls results/runs/*.json)
          run=$(basename "$file" .json)
          npm run -s rb -- summarize "$file" --out "summary/$run.json"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: run-${{ steps.summarize.outputs.run }}
          path: results/runs/
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: summary-${{ matrix.host }}
          path: summary/
          retention-days: 90

      - name: Fail if a framework was not measured
        if: steps.measure.outcome == 'failure'
        run: |
          echo "::error::A framework was not measured on ${{ matrix.host }}. Its entry in the run file says why."
          exit 1

  record:
    name: record the summaries
    needs: measure
    if: always() && needs.measure.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: results
      # Each host's job uploads its own summary, and a host whose job never summarized has none.
      - uses: actions/download-artifact@v8
        with:
          pattern: summary-*
          merge-multiple: true
          path: /tmp/summary
      - run: |
          shopt -s nullglob
          summaries=(/tmp/summary/*.json)
          if [ ${#summaries[@]} -eq 0 ]; then
            echo "::error::No host produced a summary."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in "${summaries[@]}"; do
            run=$(basename "$file" .json)
            mkdir -p "runs/${run:0:7}"
            cp "$file" "runs/${run:0:7}/"
            git add runs
            git commit -m "Record run $run"
          done
          git push origin HEAD:results
