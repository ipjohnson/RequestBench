# Measurement on GitHub-hosted runners.
#
# A job is one suite on one execution host and holds every framework that host supports.
# One job is one machine, so every absolute number in it was measured under the same
# conditions and they can be read against each other.
#
# The ratio to each target's own bare baseline is what crosses hosts; the absolute numbers
# are comparable only inside the single run that produced them.
name: measure

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      hosts:
        description: JSON array of execution hosts to measure.
        default: '["container","gcp-func","lambda-rie"]'
        type: string
      seconds:
        description: Blend only. Override rung duration. Empty means the full 60s rungs.
        default: ""
        type: string
      count:
        description: Serial only. How many requests of the pinned sequence to replay.
        default: "40000"
        type: string
      targets:
        description: >
          Measure exactly these targets instead of everything the host supports, as
          language:target,language:target. A name may repeat, which is how the same target
          is measured in two positions to separate its cost from its position in the run.
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(github.event.inputs.hosts || '["container","gcp-func","lambda-rie"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: targets/node/package-lock.json

      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: targets/node

      - name: Resolve every target this host supports
        id: resolve
        env:
          # Through the environment rather than interpolated into the script: a dispatch
          # input is attacker-controlled on a public repository.
          RB_OVERRIDE: ${{ github.event.inputs.targets }}
        run: |
          if [ -n "$RB_OVERRIDE" ]; then
            echo "targets=$RB_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "built=$(echo "$RB_OVERRIDE" | tr ',' '\n' | grep -c .)" >> "$GITHUB_OUTPUT"
            echo "measuring only: $RB_OVERRIDE"
          else
            python3 harness/hosts.py --host "${{ matrix.host }}" --github-output >> "$GITHUB_OUTPUT"
            python3 harness/hosts.py --host "${{ matrix.host }}"
          fi

      - name: Record the machine
        if: steps.resolve.outputs.built != '0'
        run: |
          echo "cores: $(nproc)"
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Is this a full run?
        id: full
        run: |
          if [ -z "${{ github.event.inputs.seconds }}" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "rung duration was overridden; this run is a smoke test"
          fi

      - name: Measure
        if: steps.resolve.outputs.built != '0'
        env:
          RB_HOST: ${{ matrix.host }}
          RB_CPUS: "2"
          RB_SUT_CPUS: "0,1"
          RB_GEN_CPUS: "2,3"
        run: |
          python3 harness/run.py \
            --targets "${{ steps.resolve.outputs.targets }}" \
            --mode docker \
            --workers 2 \
            --count "${{ github.event.inputs.count || '40000' }}" \
            --emit-path /tmp/rb-result-path \
            ${{ github.event.inputs.seconds && format('--seconds {0}', github.event.inputs.seconds) || '' }}

      - name: Summarize
        id: sum
        if: steps.resolve.outputs.built != '0'
        run: |
          RAW=$(cat /tmp/rb-result-path)
          NAME=$(basename "$RAW" .jsonl)
          MONTH=$(date -u +%Y-%m)
          TRACKED=""
          [ "${{ steps.full.outputs.yes }}" = "true" ] && TRACKED="--tracked"
          mkdir -p "out/$MONTH"
          # shellcheck disable=SC2086
          python3 harness/summarize.py "$RAW" $TRACKED \
            --runner github-hosted \
            --out "out/$MONTH/$NAME.json"
          gzip -9 -c "$RAW" > "/tmp/$NAME.jsonl.gz"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          python3 harness/report.py "$RAW"

      - name: Upload raw samples
        if: steps.resolve.outputs.built != '0'
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ steps.sum.outputs.name }}
          path: /tmp/${{ steps.sum.outputs.name }}.jsonl.gz
          retention-days: 90

      - name: Upload summary
        if: steps.resolve.outputs.built != '0' && steps.full.outputs.yes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: summary-${{ matrix.host }}
          path: out/**/*.json
          retention-days: 90

  collect:
    name: record summaries
    needs: measure
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # The results branch is orphan and data-only: nothing watches it, so recording a run
      # adds no commit to main's history and triggers no CI.
      - uses: actions/checkout@v7
        with:
          ref: results

      - name: Download every host's summary
        uses: actions/download-artifact@v8
        with:
          pattern: summary-*
          path: /tmp/summaries
          merge-multiple: true

      - name: Commit them in one go
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(/tmp/summaries/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no full-run summaries produced; nothing to record"
            exit 0
          fi
          # Summaries are filed by month, so a directory stays browsable after a year of
          # nightly runs rather than holding several hundred siblings.
          for f in "${files[@]}"; do
            month=$(basename "$(dirname "$f")")
            mkdir -p "summary/$month"
            cp "$f" "summary/$month/"
          done
          git config user.name  "requestbench"
          git config user.email "requestbench@users.noreply.github.com"
          git add summary
          if git diff --cached --quiet; then
            echo "no summary change"
            exit 0
          fi
          git commit -m "Record ${#files[@]} summary file(s) from run ${{ github.run_id }}"
          git pull --rebase --autostash origin results
          git push origin HEAD:results
