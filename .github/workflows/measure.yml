# Measures every framework on container-h1, one after another on one GitHub-hosted runner, so
# every number in a run was taken on the same machine. The run's summary is added to the results
# branch under runs/<month>/, and pages.yml publishes the site when this finishes.
name: measure

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    name: container-h1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      run: ${{ steps.summarize.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Every framework's image is built in this one job, and the runner's preinstalled toolchains
      # leave too little disk for all of them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # A framework that fails its gate or its boot has an entry saying why, and the others are
      # still measured, so the run is summarized and recorded either way.
      - name: Measure
        id: measure
        continue-on-error: true
        env:
          RB_SUT_CPUS: "0,1"
          RB_GEN_CPUS: "2,3"
        run: npm run rb -- measure --host container-h1

      - name: Summarize
        id: summarize
        run: |
          file=$(ls results/runs/*.json)
          run=$(basename "$file" .json)
          npm run -s rb -- summarize "$file" --out "summary/$run.json"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: run-${{ steps.summarize.outputs.run }}
          path: results/runs/
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: summary
          path: summary/
          retention-days: 90

      - name: Fail if a framework was not measured
        if: steps.measure.outcome == 'failure'
        run: |
          echo "::error::A framework was not measured. Its entry in the run file says why."
          exit 1

  record:
    name: record the summary
    needs: measure
    if: always() && needs.measure.outputs.run != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: results
      - uses: actions/download-artifact@v8
        with:
          name: summary
          path: /tmp/summary
      - env:
          RUN: ${{ needs.measure.outputs.run }}
        run: |
          month=${RUN:0:7}
          mkdir -p "runs/$month"
          cp "/tmp/summary/$RUN.json" "runs/$month/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs
          git commit -m "Record run $RUN"
          git push origin HEAD:results
