# Render the results site.
#
# Triggered by measure finishing rather than by a push to the results branch: that branch
# is orphan and carries no .github directory, so a push to it triggers nothing at all.
name: pages

on:
  workflow_run:
    workflows: [measure]
    types: [completed]
  push:
    branches: [main]
    paths:
      - site/**
      - package.json
      - package-lock.json
      - harness/siteview.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a manual dispatch and a push-triggered build were
# cancelling each other, which left the published site stale with no failure to notice.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the generator
        uses: actions/checkout@v7
        with:
          # Framework pages read each bundle's files out of history at the commit the run
          # recorded. A shallow clone holds one commit, so every page would report its
          # source unavailable.
          fetch-depth: 0

      - name: Check out the data
        uses: actions/checkout@v7
        with:
          ref: results
          path: _results

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Both, because the seam runs one way: the site is TypeScript, and harness/siteview.py is
      # what reads the bundle and locates the handlers in git history for the framework pages.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: npm ci --no-audit --no-fund

      - name: Check the site
        run: |
          npm run lint
          npm run typecheck --workspace=@rb/site
          npm test --workspace=@rb/site

      # Exemplars come from main beside the targets; summaries come from the data branch.
      - name: Build the site
        run: |
          node site/tools/build.js \
            --summaries _results/summary \
            --exemplars results/exemplars \
            --out site/dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
