# Validation only. A PR proves every target still answers every endpoint identically.
# No load is generated here: timings from a shared CI runner would be noise.
# Measurement is its own workflow and runs per execution host.
#
# The jobs below are one per toolchain, because each needs its own setup action and its
# own dependency cache. That is a CI packaging constraint and nothing to do with how a
# measurement is shaped.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Regenerate fixture, plan and sequence
        run: |
          python3 harness/make_fixture.py
          python3 harness/plan.py
          python3 harness/sequence.py
      - name: Fail if generated files drifted from what is committed
        run: |
          GEN=(spec/fixture.json spec/plan.json spec/sequence.json)
          if ! git diff --quiet -- "${GEN[@]}"; then
            echo "a generated spec file is stale. Run 'make spec' and commit."
            git --no-pager diff --stat -- "${GEN[@]}"
            exit 1
          fi
          echo "fixture, plan and sequence match their generators"

  bundles:
    name: target bundles resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # A bundle that resolves to a partial file set still hashes cleanly, so the only way
      # to notice the convention failing to fit a new language is to assert the roles.
      - name: Every implemented target resolves a bundle
        run: python3 harness/bundle.py --all --check

      # A snippet that cannot be located is a page with nothing to show, and an ambiguous
      # one would render a comment or a test as the implementation. Only the targets that
      # are rewired to the current spec are required: the rest do not serve these routes.
      - name: Every conforming target locates every endpoint
        run: python3 harness/snippets.py --check --required

  expectation:
    name: the expectation matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # spec/expected.json records the digests of the plan and fixture it was taken
      # against. A regenerated fixture changes every body, and a stale expectation
      # would then fail every target for a reason belonging to none of them.
      - name: spec/expected.json describes the committed plan and fixture
        run: |
          python3 -c "import sys; sys.path.insert(0, 'harness'); import expected;\
          why = expected.stale_against_spec();\
          print(why or 'spec/expected.json is current'); sys.exit(1 if why else 0)"

  workflows:
    name: workflow files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  node:
    name: node targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            targets/node/package-lock.json
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: targets/node
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every node target answers spec/expected.json
        run: python3 harness/run.py --targets node:fastify,node:express,node:hono,node:koa,node:h3 --mode local --expect

  go:
    name: go targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache-dependency-path: targets/go/go.sum }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: go build ./...
        working-directory: targets/go
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every go target answers spec/expected.json
        run: python3 harness/run.py --targets go:gin,go:echo,go:chi,go:gorilla-mux,go:fiber --mode local --expect

  java:
    name: java targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # One reactor build for all six, rather than an image build per target: the local
      # launcher runs the jar the same way the container ENTRYPOINT does.
      - name: Build every java target
        run: mvn -B -q -DskipTests package
        working-directory: targets/java
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every java target answers spec/expected.json
        run: python3 harness/run.py --targets java:spring-boot,java:quarkus,java:micronaut,java:helidon-se,java:vertx,java:javalin --mode local --expect

  python:
    name: python targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: targets/python/requirements.txt
      # One install for all six, from the lockfile they share. harness/run.py launches them
      # with the interpreter it is running under when there is no virtualenv beside them,
      # which is what makes that one install enough.
      - run: pip install -r requirements.txt
        working-directory: targets/python
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every python target answers spec/expected.json
        run: python3 harness/run.py --targets python:fastapi,python:starlette,python:litestar,python:sanic,python:flask,python:django-asgi --mode local --expect

  dotnet:
    name: dotnet targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: targets/dotnet/global.json }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # One build for all five, rather than an image build per target: the local launcher
      # runs the same dll the container ENTRYPOINT does.
      - name: Build every dotnet target
        run: dotnet build -c Release --nologo
        working-directory: targets/dotnet
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every dotnet target answers spec/expected.json
        run: python3 harness/run.py --targets dotnet:minimal-apis,dotnet:aspnet-mvc,dotnet:fastendpoints,dotnet:carter,dotnet:wolverine-http --mode local --expect

  rust:
    name: rust targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: targets/rust }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # One workspace build for all six, rather than an image build per target: the local
      # launcher runs the binary the same way the container ENTRYPOINT does, and building
      # six release binaries per pull request costs more than the gate is worth.
      - name: Build every rust target
        run: cargo build --locked --bins
        working-directory: targets/rust
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      # The client is the only thing that talks HTTP to a target, for both authorities.
      - name: Build the conformance client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Every rust target answers spec/expected.json
        run: python3 harness/run.py --targets rust:axum,rust:actix-web,rust:rocket,rust:poem,rust:salvo,rust:warp --mode local --expect

  images:
    name: container images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: rust, target: axum }
          - { language: dotnet, target: minimal-apis }
          - { language: dotnet, target: aspnet-mvc }
          - { language: dotnet, target: fastendpoints }
          - { language: dotnet, target: carter }
          - { language: dotnet, target: wolverine-http }
          - { language: python, target: fastapi }
          - { language: python, target: starlette }
          - { language: python, target: litestar }
          - { language: python, target: sanic }
          - { language: python, target: flask }
          - { language: python, target: django-asgi }
          - { language: node, target: express }
          - { language: node, target: fastify }
          - { language: node, target: hono }
          - { language: node, target: koa }
          - { language: node, target: h3 }
          - { language: go,   target: gin }
          - { language: go,   target: echo }
          - { language: go,   target: chi }
          - { language: go,   target: gorilla-mux }
          - { language: go,   target: fiber }
          - { language: java, target: javalin }
          - { language: java, target: vertx }
          - { language: java, target: helidon-se }
          - { language: java, target: spring-boot }
          - { language: java, target: micronaut }
          - { language: java, target: quarkus }
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.language }}/${{ matrix.target }}
        run: |
          docker build -f targets/${{ matrix.language }}/Dockerfile \
            --build-arg TARGET=${{ matrix.target }} \
            -t rb/${{ matrix.language }}-${{ matrix.target }} .

      # Building only proves the Dockerfile parses. A CMD left pointing at a file that had
      # been deleted built clean and was unrunnable, so the image has to actually answer.
      - name: Boot it and ask what it is
        run: |
          docker run -d --rm --name rb-smoke -p 8080:8080 \
            rb/${{ matrix.language }}-${{ matrix.target }}
          for _ in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:8080/health >/dev/null; then
            docker logs rb-smoke
            exit 1
          fi
          curl -s http://127.0.0.1:8080/__meta
          docker stop rb-smoke
