# Every pull request runs the repository's checks, then, for each framework it can change,
# `rb validate` on every host the framework implements and the framework's own suite. A framework
# is picked when a file in its directory changes, other than prose. Every framework is picked when
# something they all depend on changes: the tests, the orchestrator, the traffic generator, the
# root npm manifests or this file.
#
# Nothing here measures, because a shared runner's timings would be noise.
name: validate

on:
  pull_request:
  # dotnet-locks.yml starts this on a branch it has pushed to, because its push starts nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The gate and the load go through the traffic generator's Rust program, which cargo builds
      # with the toolchain traffic-generator/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: traffic-generator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: traffic-generator
          shared-key: traffic-generator
      - run: npm run typecheck
      - run: npm test
      - run: npm run rb -- check

  frameworks:
    name: frameworks to validate
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.pick.outputs.frameworks }}
      validations: ${{ steps.pick.outputs.validations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=${BASE:-$(git merge-base origin/main HEAD)}
          every=false
          changed=""
          while IFS= read -r path; do
            case "$path" in
              *.md) ;;
              frameworks/*/*/*)
                IFS=/ read -r _ language name _ <<< "$path"
                changed+="$language:$name"$'\n' ;;
              tests/* | orchestrator/* | traffic-generator/* | package.json | package-lock.json | tsconfig.json | .github/workflows/validate.yml)
                every=true ;;
            esac
          done < <(git diff --name-only "$base"...HEAD)

          ids=()
          while IFS= read -r manifest; do
            IFS=/ read -r _ language name _ <<< "$manifest"
            if [ "$every" = true ] || grep -qxF "$language:$name" <<< "$changed"; then ids+=("$language:$name"); fi
          done < <(git ls-files -- ':(glob)frameworks/*/*/rb.json')

          json=$(printf '%s\n' "${ids[@]}" | jq -Rnc '[inputs | select(test("^[a-z0-9-]+:[a-z0-9.-]+$"))
            | split(":") as [$language, $name] | {id: ., language: $language, dir: "frameworks/\($language)/\($name)"}]')
          echo "frameworks=$json" >> "$GITHUB_OUTPUT"
          echo "Frameworks to validate: $(jq -c 'map(.id)' <<< "$json")"

          # One validation for each host a framework's rb.json names.
          validations=$(jq -c '.[]' <<< "$json" | while IFS= read -r framework; do
            jq -c --argjson f "$framework" '.hosts | keys[] | $f + {host: .}' "$(jq -r .dir <<< "$framework")/rb.json"
          done | jq -sc .)
          echo "validations=$validations" >> "$GITHUB_OUTPUT"

  validate:
    name: validate ${{ matrix.validation.id }} on ${{ matrix.validation.host }}
    needs: frameworks
    if: needs.frameworks.outputs.frameworks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        validation: ${{ fromJSON(needs.frameworks.outputs.validations) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The gate and the load go through the traffic generator's Rust program, which cargo builds
      # with the toolchain traffic-generator/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: traffic-generator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: traffic-generator
          shared-key: traffic-generator
      # --exemplars writes each test's request and answer to results/exemplars. The file is uploaded,
      # so a reviewer can read what the framework answered. The site shows the ones measure.yml records.
      - id: validate
        env:
          ID: ${{ matrix.validation.id }}
          HOST: ${{ matrix.validation.host }}
        run: |
          npm run rb -- validate "$ID" --host "$HOST" --exemplars
          echo "exemplar=${ID/:/-}@$HOST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: exemplar-${{ steps.validate.outputs.exemplar }}
          path: results/exemplars/${{ steps.validate.outputs.exemplar }}.json
          if-no-files-found: error
          retention-days: 14

  # The framework's own tests, with the toolchain its language needs. A test-only dependency never
  # reaches the image, so this is the only job that exercises it.
  suite:
    name: suite ${{ matrix.framework.id }}
    needs: frameworks
    if: needs.frameworks.outputs.frameworks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.frameworks.outputs.frameworks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: matrix.framework.language == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ matrix.framework.dir }}/global.json
      - if: matrix.framework.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.framework.dir }}/go.mod
          cache-dependency-path: ${{ matrix.framework.dir }}/go.sum
      # The JDK the framework's container-h1 image runs on, read from its last FROM line.
      - if: matrix.framework.language == 'java'
        id: java
        env:
          DIR: ${{ matrix.framework.dir }}
        run: |
          image=$(grep -E '^FROM (eclipse-temurin|amazoncorretto):' "$DIR/container-h1/Dockerfile" | tail -1 | awk '{print $2}')
          case "$image" in
            eclipse-temurin:*) echo "distribution=temurin" >> "$GITHUB_OUTPUT" ;;
            amazoncorretto:*) echo "distribution=corretto" >> "$GITHUB_OUTPUT" ;;
          esac
          version=${image#*:}
          echo "version=${version%%[!0-9]*}" >> "$GITHUB_OUTPUT"
      - if: matrix.framework.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: ${{ steps.java.outputs.distribution }}
          java-version: ${{ steps.java.outputs.version }}
          cache: maven
          cache-dependency-path: ${{ matrix.framework.dir }}/**/pom.xml
      - if: matrix.framework.language == 'python'
        uses: astral-sh/setup-uv@v6
      - if: matrix.framework.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.framework.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.framework.dir }}
      - env:
          ID: ${{ matrix.framework.id }}
        run: npm run rb -- suite "$ID"

  # One result for the whole run, which a ruleset can require. Skipped validate and suite jobs mean
  # the pull request changes no framework.
  validated:
    name: validated
    if: always()
    needs: [checks, frameworks, validate, suite]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
