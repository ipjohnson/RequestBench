# Validation only. A PR proves every target still answers every endpoint identically.
# No load is generated here: timings from a shared CI runner would be noise.
# Measurement is its own workflow, and it splits by execution host rather than by language.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Regenerate fixture, plan and sequence
        run: |
          python3 harness/make_fixture.py
          python3 harness/plan.py
          python3 harness/sequence.py
      - name: Fail if generated files drifted from what is committed
        run: |
          GEN=(spec/fixture.json spec/plan.json spec/sequence.json)
          if ! git diff --quiet -- "${GEN[@]}"; then
            echo "a generated spec file is stale. Run 'make spec' and commit."
            git --no-pager diff --stat -- "${GEN[@]}"
            exit 1
          fi
          echo "fixture, plan and sequence match their generators"

  bundles:
    name: target bundles resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # A bundle that resolves to a partial file set still hashes cleanly, so the only way
      # to notice the convention failing to fit a new language is to assert the roles.
      - name: Every implemented target resolves a bundle
        run: python3 harness/bundle.py --all --check

  workflows:
    name: workflow files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  node:
    name: node targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: targets/node/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: targets/node
      - name: Boot and conform every node target
        run: python3 harness/run.py --language node --targets node-http,fastify,express,hono,koa,h3 --validate-only
      - name: Fail if the reference fingerprints drifted
        run: |
          # The reference is the baseline's own conformance output, so it can only be
          # regenerated from a baseline that serves the current endpoint set. Until
          # node-http is rewired there is nothing here to compare against.
          if ! jq -e '.conformance_required.targets | index("node:node-http")' \
               spec/matrix.json >/dev/null; then
            echo "node-http is not required to conform yet; nothing to regenerate."
            exit 0
          fi
          RB_TARGET=baseline PORT=8080 node targets/node/_hosts/container.mjs & SRV=$!
          # Without this the server outlives a failing gate, because the step aborts on
          # the non-zero exit before it reaches the kill.
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 0.25
          done
          python3 harness/conform.py 127.0.0.1:8080 --quiet \
            --fingerprint spec/fingerprint.node-http.json
          if ! git diff --quiet -- spec/fingerprint.node-http.json; then
            echo "the committed reference fingerprints no longer match the baseline."
            echo "Every other target is compared against this file, so regenerating it"
            echo "silently would move all six targets at once. Commit it deliberately."
            git --no-pager diff -- spec/fingerprint.node-http.json
            exit 1
          fi
          echo "reference fingerprints unchanged"

  go:
    name: go targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: targets/go/go.sum }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: go build ./...
        working-directory: targets/go
      - name: Boot and conform every go target against the node reference
        run: python3 harness/run.py --language go --targets net-http,gin,echo,chi,gorilla-mux,fiber --validate-only

  java:
    name: java targets conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # One reactor build for all seven, rather than an image build per target: the local
      # launcher runs the jar the same way the container ENTRYPOINT does.
      - name: Build every java target
        run: mvn -B -q -DskipTests package
        working-directory: targets/java
      - name: Boot and conform every java target against the node reference
        run: |
          python3 harness/run.py --language java --validate-only \
            --targets bare-netty,javalin,vertx,helidon-se,spring-boot,micronaut,quarkus

  images:
    name: container images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: node, target: baseline }
          - { language: node, target: express }
          - { language: node, target: fastify }
          - { language: node, target: hono }
          - { language: node, target: koa }
          - { language: node, target: h3 }
          - { language: go,   target: baseline }
          - { language: go,   target: gin }
          - { language: go,   target: echo }
          - { language: go,   target: chi }
          - { language: go,   target: gorilla-mux }
          - { language: go,   target: fiber }
          - { language: java, target: baseline }
          - { language: java, target: javalin }
          - { language: java, target: vertx }
          - { language: java, target: helidon-se }
          - { language: java, target: spring-boot }
          - { language: java, target: micronaut }
          - { language: java, target: quarkus }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.language }}/${{ matrix.target }}
        run: |
          docker build -f targets/${{ matrix.language }}/Dockerfile \
            --build-arg TARGET=${{ matrix.target }} \
            -t rb/${{ matrix.language }}-${{ matrix.target }} .

      # Building only proves the Dockerfile parses. A CMD left pointing at a file that had
      # been deleted built clean and was unrunnable, so the image has to actually answer.
      - name: Boot it and ask what it is
        run: |
          docker run -d --rm --name rb-smoke -p 8080:8080 \
            rb/${{ matrix.language }}-${{ matrix.target }}
          for _ in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:8080/health >/dev/null; then
            docker logs rb-smoke
            exit 1
          fi
          curl -s http://127.0.0.1:8080/__meta
          docker stop rb-smoke
