components:
  schemas:
    BoundCheckedOrder:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/CheckedOrder"
        fields:
          format: int64
          type: integer
      required:
        - fields
        - bytes
        - echo
      type: object
    BoundOrder:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/Order"
        fields:
          format: int64
          type: integer
      required:
        - fields
        - bytes
        - echo
      type: object
    CheckedLine:
      additionalProperties: false
      properties:
        productId:
          format: int64
          minimum: 1
          type: integer
        qty:
          format: int64
          minimum: 1
          type: integer
      required:
        - productId
        - qty
      type: object
    CheckedOrder:
      additionalProperties: false
      properties:
        customerId:
          format: int64
          minimum: 1
          type: integer
        lines:
          items:
            $ref: "#/components/schemas/CheckedLine"
          minItems: 1
          nullable: true
          type: array
        status:
          minLength: 1
          type: string
      required:
        - customerId
        - status
        - lines
      type: object
    EchoedHeadersBound:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/HeadersBound"
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - echo
        - size
        - count
        - items
      type: object
    EchoedParametersOne:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/ParametersOne"
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - echo
        - size
        - count
        - items
      type: object
    EchoedParametersTwo:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/ParametersTwo"
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - echo
        - size
        - count
        - items
      type: object
    EchoedQueryOne:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/QueryOne"
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - echo
        - size
        - count
        - items
      type: object
    EchoedSearch:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        echo:
          $ref: "#/components/schemas/Search"
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - echo
        - size
        - count
        - items
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    HeadersBound:
      additionalProperties: false
      properties:
        account:
          format: int64
          type: integer
        requestId:
          type: string
        tenant:
          type: string
      required:
        - tenant
        - requestId
        - account
      type: object
    Item:
      additionalProperties: false
      properties:
        category:
          type: string
        id:
          format: int64
          type: integer
        inStock:
          type: boolean
        name:
          type: string
        priceCents:
          format: int64
          type: integer
      required:
        - id
        - name
        - category
        - priceCents
        - inStock
      type: object
    ItemPatch:
      additionalProperties: false
      properties:
        inStock:
          type: boolean
        priceCents:
          format: int64
          type: integer
      type: object
    Line:
      additionalProperties: false
      properties:
        productId:
          format: int64
          type: integer
        qty:
          format: int64
          type: integer
      required:
        - productId
        - qty
      type: object
    NewItem:
      additionalProperties: false
      properties:
        category:
          type: string
        inStock:
          type: boolean
        name:
          type: string
        priceCents:
          format: int64
          type: integer
      required:
        - name
        - category
        - priceCents
        - inStock
      type: object
    Order:
      additionalProperties: false
      properties:
        customerId:
          format: int64
          type: integer
        lines:
          items:
            $ref: "#/components/schemas/Line"
          nullable: true
          type: array
        status:
          type: string
      required:
        - customerId
        - status
        - lines
      type: object
    ParametersOne:
      additionalProperties: false
      properties:
        one:
          format: int64
          type: integer
      required:
        - one
      type: object
    ParametersTwo:
      additionalProperties: false
      properties:
        one:
          format: int64
          type: integer
        two:
          format: int64
          type: integer
      required:
        - one
        - two
      type: object
    Payload:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Item"
          nullable: true
          type: array
        size:
          type: string
      required:
        - size
        - count
        - items
      type: object
    QueryOne:
      additionalProperties: false
      properties:
        page:
          format: int64
          type: integer
      required:
        - page
      type: object
    Search:
      additionalProperties: false
      properties:
        category:
          type: string
        maxPrice:
          format: int64
          type: integer
        minPrice:
          format: int64
          type: integer
        page:
          format: int64
          type: integer
        q:
          type: string
        size:
          format: int64
          type: integer
        sort:
          type: string
        status:
          type: string
      required:
        - page
        - size
        - status
        - category
        - sort
        - q
        - minPrice
        - maxPrice
      type: object
    UploadEcho:
      additionalProperties: false
      properties:
        requestId:
          type: string
        tenant:
          type: string
      required:
        - tenant
        - requestId
      type: object
    Uploaded:
      additionalProperties: false
      properties:
        echo:
          $ref: "#/components/schemas/UploadEcho"
        file:
          $ref: "#/components/schemas/UploadedFile"
      required:
        - file
        - echo
      type: object
    UploadedFile:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        name:
          type: string
      required:
        - name
        - bytes
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
