# The application's dependencies, and the suite's. uv.lock beside it is what uv resolved, which
# the image installs with --locked. Ranges move patch releases alone for 0.x packages, and minor
# releases too for the rest.
[project]
name = "rb-django-asgi"
version = "0"
requires-python = ">=3.14"
dependencies = [
  "django~=6.1",
  "django-cors-headers~=4.9",
  # uvloop and httptools, which uvicorn picks when they are installed, come with standard.
  "uvicorn[standard]~=0.53.0",
]

[dependency-groups]
# pytest-asyncio runs the async tests, which send through Django's AsyncClient.
dev = ["pytest~=9.1", "pytest-asyncio~=1.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["UnitTests"]
pythonpath = ["Implementation"]
addopts = "--strict-markers"
markers = ["corpus(*ids): the corpus tests this test holds the framework to"]
asyncio_mode = "auto"
