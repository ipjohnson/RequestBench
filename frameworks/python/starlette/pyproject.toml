# The application's dependencies, the suite's, lambda-emulator's and container-h2's. uv.lock beside it is what uv
# resolved, which every host's image installs with --locked. Ranges move patch releases alone for
# 0.x packages, and minor releases too for the rest.
[project]
name = "rb-starlette"
version = "0"
requires-python = ">=3.14"
dependencies = [
  "cachetools~=7.2",
  "jinja2~=3.1",
  "pydantic~=2.13",
  "python-multipart~=0.0.32",
  # Starlette validates nothing. SpecTree is the request validation its third-party packages page
  # lists, and it validates with Pydantic.
  "spectree[pydantic]~=3.0",
  "sse-starlette~=3.4",
  "starlette~=1.7",
  # uvloop and httptools, which uvicorn picks when they are installed, come with standard.
  "uvicorn[standard]~=0.53.0",
]

[dependency-groups]
# Starlette's TestClient sends through httpx2. SchemaGenerator reads the docstrings with PyYAML when
# Client/document.py writes the document, and the Kiota client's tests call the application through
# Kiota's Python runtime.
dev = ["httpx2~=2.13", "microsoft-kiota-bundle~=1.14", "pytest~=9.1", "pyyaml~=6.0"]
# Mangum, which turns each Lambda event into a request for the application on lambda-emulator.
# Only that host's image installs the group.
lambda-emulator = ["mangum~=0.22.0"]
# Hypercorn, the ASGI server with HTTP/2 that container-h2 runs, because uvicorn speaks only
# HTTP/1.1. Only that host's image installs the group.
container-h2 = ["hypercorn[uvloop]~=0.18.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["UnitTests"]
pythonpath = ["Implementation", "container-h1", "Client"]
addopts = "--strict-markers"
markers = ["corpus(*ids): the corpus tests this test holds the framework to"]
# Raised inside Starlette's TestClient, by the request configuration classes Kiota writes into every
# request builder, and by Kiota's runtime, none of which the suite can change.
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:This class is deprecated. Please use the generic RequestConfiguration class:DeprecationWarning",
  "ignore:GetQueryParameters is deprecated:DeprecationWarning",
]
