# The REST Client is in the Client module's jar, which Quarkus indexes only when told to.
quarkus.index-dependency.client.group-id=dev.requestbench
quarkus.index-dependency.client.artifact-id=client

quarkus.http.test-port=0

# tests/payloads, found from Implementation/, where RB_PAYLOADS is not set. RB_PAYLOADS in the
# environment wins.
RB_PAYLOADS=../../../../tests/payloads
