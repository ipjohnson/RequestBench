# The contract names the port in PORT.
quarkus.http.port=${PORT:8080}

# /__meta reads the Vert.x version from this resource, which a native image leaves out unless
# asked. The JVM reads it from the vertx-core jar.
quarkus.native.resources.includes=META-INF/vertx/vertx-version.txt

# rb:wiring compressed.*
# Vert.x compresses an answer when the request asks for gzip and its type is in
# quarkus.http.compress-media-types, JSON among them, at gzip's fastest level. The switch is one for
# the whole HTTP server.
quarkus.http.enable-compression=true
quarkus.http.compression-level=1
# rb:end

# rb:wiring authorized.*
# A request to /authorized/ passes BearerTokenPolicy before it is routed.
quarkus.http.auth.permission.authorized.paths=/authorized/*
quarkus.http.auth.permission.authorized.policy=bearer-token
# No request is authenticated until something asks who sent it, so the routes outside /authorized
# are not.
quarkus.http.auth.proactive=false
# rb:end

# rb:wiring cache.*
# Every Caffeine cache holds 64 answers, room for the cache family's 52 keys, and keeps one 30
# seconds. The extension's caches have no size limit and no expiry of their own.
quarkus.cache.caffeine.maximum-size=64
quarkus.cache.caffeine.expire-after-write=30S
# rb:end

# rb:wiring cors.*
# One filter for the whole server, run before routing, so every path answers the allowed origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://shop.example.com
quarkus.http.cors.methods=GET
quarkus.http.cors.headers=x-rb-tenant
quarkus.http.cors.access-control-max-age=600S
# rb:end
