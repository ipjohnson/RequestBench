micronaut.application.name=implementation

# The contract names the port in PORT.
micronaut.server.port=${PORT:8080}

# rb:wiring compressed.*
# The Netty server's compression, on the whole server at gzip's fastest level. It leaves an
# answer shorter than micronaut.server.netty.compression-threshold, 1 KB by default, as it is.
micronaut.server.netty.compression-level=1

# rb:wiring authorized.*
# micronaut-security's filter runs on /authorized alone. Its default pattern is every path.
micronaut.security.filter.pattern=/authorized/**

# rb:wiring cache.*
# One Caffeine cache per route. Without a configuration, micronaut-cache creates a cache the first
# time a method names it, with no size limit and no expiry. Each holds 64 answers, room for the
# cache family's 52 keys, and keeps one 30 seconds.
micronaut.caches.cache-small.maximum-size=64
micronaut.caches.cache-small.expire-after-write=30s
micronaut.caches.cache-medium.maximum-size=64
micronaut.caches.cache-medium.expire-after-write=30s
micronaut.caches.cache-large.maximum-size=64
micronaut.caches.cache-large.expire-after-write=30s
micronaut.caches.cache-vary-one.maximum-size=64
micronaut.caches.cache-vary-one.expire-after-write=30s
micronaut.caches.cache-vary-many.maximum-size=64
micronaut.caches.cache-vary-many.expire-after-write=30s

# rb:wiring cors.*
# Micronaut's CorsFilter with one configuration, which names an origin and no path, so it covers
# every route.
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.shop.allowed-origins=https://shop.example.com
micronaut.server.cors.configurations.shop.allowed-methods=GET
micronaut.server.cors.configurations.shop.allowed-headers=x-rb-tenant
micronaut.server.cors.configurations.shop.max-age=600

# rb:wiring template.*
# The template routes return a ModelAndView, which micronaut-views renders through its body writer.
# Its filter renders a route annotated @View instead, and runs on every path, so it is off.
micronaut.views.filter.enabled=false

# rb:wiring static.*
# The static resource router, over the payload directory under /static/.
micronaut.router.static-resources.payloads.paths=file:${rb.payloads}
micronaut.router.static-resources.payloads.mapping=/static/**
# rb:end
