components:
  schemas:
    BodyRoutes.Bound_FirstErrorOrder_:
      required:
      - bytes
      - echo
      - fields
      type: object
      properties:
        fields:
          type: integer
          format: int32
        bytes:
          type: integer
          format: int64
        echo:
          type: object
      description: "What a bind or validate row answers: the order back, with the\
        \ leaves the handler found in it and the bytes it received."
    BodyRoutes.Bound_OrderRequest_:
      required:
      - bytes
      - echo
      - fields
      type: object
      properties:
        fields:
          type: integer
          format: int32
        bytes:
          type: integer
          format: int64
        echo:
          type: object
      description: "What a bind or validate row answers: the order back, with the\
        \ leaves the handler found in it and the bytes it received."
    ContractRoutes.Meta:
      required:
      - adapter
      - bootMs
      - framework
      - runtime
      - serializer
      - version
      type: object
      properties:
        framework:
          type: string
        version:
          type: string
        runtime:
          type: string
        adapter:
          type: string
        serializer:
          type: string
        bootMs:
          type: integer
          format: int64
      description: "/__meta: what ran, recorded on the result row and never checked."
    Echoed_HeadersRoutes.Bound_:
      required:
      - count
      - echo
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        echo:
          $ref: "#/components/schemas/HeadersRoutes.Bound"
      description: A payload with the values a handler bound written back beside its
        own fields.
    Echoed_ParametersRoutes.One_:
      required:
      - count
      - echo
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        echo:
          $ref: "#/components/schemas/ParametersRoutes.One"
      description: A payload with the values a handler bound written back beside its
        own fields.
    Echoed_ParametersRoutes.Two_:
      required:
      - count
      - echo
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        echo:
          $ref: "#/components/schemas/ParametersRoutes.Two"
      description: A payload with the values a handler bound written back beside its
        own fields.
    Echoed_QueryRoutes.One_:
      required:
      - count
      - echo
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        echo:
          $ref: "#/components/schemas/QueryRoutes.One"
      description: A payload with the values a handler bound written back beside its
        own fields.
    Echoed_Search_:
      required:
      - count
      - echo
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        echo:
          $ref: "#/components/schemas/Search"
      description: A payload with the values a handler bound written back beside its
        own fields.
    Event_Item_:
      required:
      - data
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Item"
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        retry:
          type: string
          nullable: true
    FirstErrorOrder:
      required:
      - customerId
      - lines
      - status
      type: object
      properties:
        customerId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
        status:
          minLength: 1
          type: string
        lines:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/OrderRequest.Line"
      description: "The same body on the route that stops at the first bad field.\
        \ micronaut-validation reports every constraint a bean breaks and has no mode\
        \ that stops at the first. The group sequence replaces this record's default\
        \ group with one group per field, validated in order, and the validator stops\
        \ at the first group with a violation."
    FormsRoutes.UploadEcho:
      required:
      - requestId
      - tenant
      type: object
      properties:
        tenant:
          type: string
        requestId:
          type: string
    FormsRoutes.Uploaded:
      required:
      - echo
      - file
      type: object
      properties:
        file:
          $ref: "#/components/schemas/FormsRoutes.UploadedFile"
        echo:
          $ref: "#/components/schemas/FormsRoutes.UploadEcho"
    FormsRoutes.UploadedFile:
      required:
      - bytes
      - name
      type: object
      properties:
        name:
          type: string
        bytes:
          type: integer
          format: int64
    HeadersRoutes.Bound:
      required:
      - account
      - requestId
      - tenant
      type: object
      properties:
        tenant:
          type: string
        requestId:
          type: string
        account:
          type: integer
          format: int32
    Item:
      required:
      - category
      - id
      - inStock
      - name
      - priceCents
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        category:
          type: string
        priceCents:
          type: integer
          format: int32
        inStock:
          type: boolean
      description: "One row of items.large, and of every payload made from it."
    ItemsRoutes.ItemPatch:
      required:
      - inStock
      - priceCents
      type: object
      properties:
        priceCents:
          type: integer
          format: int32
        inStock:
          type: boolean
      description: The two fields items.update changes.
    ItemsRoutes.NewItem:
      required:
      - category
      - inStock
      - name
      - priceCents
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        priceCents:
          type: integer
          format: int32
        inStock:
          type: boolean
      description: An item as a client creates or replaces one.
    ModelAndView_Payload_:
      required:
      - view
      type: object
      properties:
        view:
          type: string
        model:
          $ref: "#/components/schemas/Payload"
    OrderRequest:
      required:
      - customerId
      - lines
      - status
      type: object
      properties:
        customerId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
        status:
          minLength: 1
          type: string
        lines:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/OrderRequest.Line"
      description: "The body the bind and validate rows send, with the rules orderRequest\
        \ states as Bean Validation constraints. micronaut-validation's processor\
        \ compiles them into the record's introspection, and they run only where a\
        \ handler marks the parameter @Valid, so the bind routes bind the same record\
        \ and check nothing."
    OrderRequest.Line:
      required:
      - productId
      - qty
      type: object
      properties:
        productId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
        qty:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
    ParametersRoutes.One:
      required:
      - one
      type: object
      properties:
        one:
          type: integer
          format: int32
    ParametersRoutes.Two:
      required:
      - one
      - two
      type: object
      properties:
        one:
          type: integer
          format: int32
        two:
          type: integer
          format: int32
    Payload:
      required:
      - count
      - items
      - size
      type: object
      properties:
        size:
          type: string
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
      description: "items.small, items.medium or items.large."
    QueryRoutes.One:
      required:
      - page
      type: object
      properties:
        page:
          type: integer
          format: int32
    Search:
      required:
      - category
      - maxPrice
      - minPrice
      - page
      - q
      - size
      - sort
      - status
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        status:
          type: string
        category:
          type: string
        sort:
          type: string
        q:
          type: string
        minPrice:
          type: integer
          format: int32
        maxPrice:
          type: integer
          format: int32
      description: "query.many's eight values, which forms.urlencoded posts as a form."
