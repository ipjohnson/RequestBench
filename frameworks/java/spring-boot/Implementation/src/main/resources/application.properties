# The contract names the port in PORT.
server.port=${PORT:8080}

# Boot's error page lists a refused body's field errors under errors. It leaves them out unless
# asked.
spring.web.error.include-binding-errors=always

# rb:wiring compressed.*
# Tomcat's compression, on the whole connector at the JDK's default gzip level. It holds back an
# answer shorter than 2 KB when it knows the length before the headers go out.
server.compression.enabled=true

# rb:wiring cache.*
# Boot configures Caffeine under Spring's cache abstraction when it is on the class path. Each cache
# holds settings.json's 64 answers and keeps one 30 seconds.
spring.cache.caffeine.spec=maximumSize=64,expireAfterWrite=30s
# rb:end
