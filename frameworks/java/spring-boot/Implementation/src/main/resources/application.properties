# The contract names the port in PORT.
server.port=${PORT:8080}

# Boot's error page lists a refused body's field errors under errors. It leaves them out unless
# asked.
spring.web.error.include-binding-errors=always

# rb:wiring compressed.*
# Tomcat's compression, on the whole connector at the JDK's default gzip level. It holds back an
# answer shorter than 2 KB when it knows the length before the headers go out.
server.compression.enabled=true
