[package]
name = "rb-loco"
version = "0.0.0"
edition = "2024"
publish = false
# The application is in Implementation/, each host's binary in the host's directory and the suite
# in UnitTests/, so every target names its path rather than following cargo's src/ and tests/.
build = "Implementation/build.rs"
autobins = false
autotests = false

# The suite is UnitTests/, so the library and the binaries build no test harness of their own.
[lib]
name = "implementation"
path = "Implementation/lib.rs"
test = false
doctest = false

[[bin]]
name = "server"
path = "container-h1/main.rs"
test = false

[[bin]]
name = "server-h2"
path = "container-h2/main.rs"
test = false
required-features = ["container-h2"]

[[bin]]
name = "lambda"
path = "lambda-emulator/main.rs"
test = false
required-features = ["lambda-emulator"]

[[test]]
name = "unit"
path = "UnitTests/main.rs"

[dependencies]
# Loco without the database, the background workers and the JWT auth its default features bring,
# which no family uses. cli starts the server as a Loco application starts, and cache_inmem is the
# store the cache family keeps its answers in.
loco-rs = { version = "1.2.0", default-features = false, features = ["cli", "cache_inmem"] }
async-trait = "0.1.92"
# The axum Loco serves its router with, named here for its SSE response and body stream, and for
# the http2 feature container-h2 turns on in it.
axum = "0.8.9"
futures-util = "0.3.34"
# lambda-emulator's runtime client and adapter, with API Gateway payload format 2.0 the only event it reads.
lambda_http = { version = "1.3.1", default-features = false, features = ["apigw_http"], optional = true }
# The allocator every Rust framework here runs on, in place of the system one.
mimalloc = "0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# The validator Loco's extractors run the rules of, at the version Loco depends on, so its derive
# implements the trait Loco calls.
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
# Loco's testing feature, whose request helper boots the application in its test environment.
loco-rs = { version = "1.2.0", default-features = false, features = ["cli", "cache_inmem", "testing"] }
# The axum-test that helper serves the application with, named for its multipart form.
axum-test = "17.3.0"
flate2 = "1.1.10"

# Whole-program optimisation, as upstream measured every Rust framework. The image build pays for
# it once, and a service built for speed ships this way.
[profile.release]
lto = "fat"
codegen-units = 1

[features]
# container-h2's server: axum's http2 feature, which Loco's own serve then answers HTTP/2 with prior
# knowledge through. Only its binary turns it on.
container-h2 = ["axum/http2"]
# lambda-emulator's function. Only its binary turns it on.
lambda-emulator = ["dep:lambda_http"]
