[package]
name = "rb-rocket"
version = "0.0.0"
edition = "2024"
publish = false
# The application is in Implementation/, each host's binary in the host's directory and the suite
# in UnitTests/, so every target names its path rather than following cargo's src/ and tests/.
build = "Implementation/build.rs"
autobins = false
autotests = false

# The suite is UnitTests/, so the library and the binary build no test harness of their own.
[lib]
name = "implementation"
path = "Implementation/lib.rs"
test = false
doctest = false

[[bin]]
name = "server"
path = "container-h1/main.rs"
test = false

[[bin]]
name = "server-h2"
path = "container-h2/main.rs"
test = false

[[bin]]
name = "lambda"
path = "lambda-emulator/main.rs"
test = false
required-features = ["lambda-emulator"]

[[test]]
name = "unit"
path = "UnitTests/main.rs"

[dependencies]
# lambda-emulator's function writes every body in base64, as lambda-web does.
base64 = { version = "0.23.1", optional = true }
cached = "4.0.0"
# The weak hasher, so an ETag comes from the crate the If-None-Match guard is built on.
entity-tag = { version = "0.2.0", features = ["weak-hasher"] }
# The status and header types of a streamed answer's prelude, in lambda-emulator's function.
http = { version = "1.5.0", optional = true }
httpdate = "1.0.3"
# lambda-emulator's runtime client. main.rs is a copy of the dispatch of lambda-web, the adapter
# written for Rocket 0.5, whose lambda_runtime 0.7 cannot stream.
lambda_runtime = { version = "1.4.0", default-features = false, optional = true }
# The allocator every Rust framework here runs on, in place of the system one.
mimalloc = "0.1.52"
# lambda-emulator's function encodes each event's path again, as lambda-web does.
percent-encoding = { version = "2.3.2", optional = true }
rocket = { version = "0.5.1", features = ["json"] }
rocket_async_compression = "0.6.1"
rocket_cors = "0.6.0"
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
rocket-etag-if-none-match = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# lambda-emulator's function reads a streamed answer's body from Rocket as it is written.
tokio-util = { version = "0.7.19", default-features = false, features = ["io"], optional = true }
# The body family's rules, run by a data guard of this application's own, because Rocket validates
# forms but not JSON.
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
flate2 = "1.1.10"

# Whole-program optimisation, as upstream measured every Rust framework. The image build pays for
# it once, and a service built for speed ships this way.
[profile.release]
lto = "fat"
codegen-units = 1

[features]
# lambda-emulator's function. Only its binary turns it on.
lambda-emulator = ["dep:base64", "dep:http", "dep:lambda_runtime", "dep:percent-encoding", "dep:tokio-util"]
