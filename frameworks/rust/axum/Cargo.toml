[package]
name = "rb-axum"
version = "0.0.0"
edition = "2024"
publish = false
# The application is in Implementation/, container-h1's server binary in container-h1/ and the
# suite in UnitTests/, so every target names its path rather than following cargo's src/ and tests/.
build = "Implementation/build.rs"
autobins = false
autotests = false

# The suite is UnitTests/, so the library and the binary build no test harness of their own.
[lib]
name = "implementation"
path = "Implementation/lib.rs"
test = false
doctest = false

[[bin]]
name = "server"
path = "container-h1/main.rs"
test = false

[[bin]]
name = "server-h2"
path = "container-h2/main.rs"
test = false
required-features = ["container-h2"]

[[test]]
name = "unit"
path = "UnitTests/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
askama = "0.16.1"
cached = { version = "4.0.0", default-features = false, features = ["ahash", "time_stores"] }
futures-util = "0.3.34"
# The allocator every Rust framework here runs on, in place of the system one.
mimalloc = "0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "fs", "validate-request"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
flate2 = "1.1.10"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Whole-program optimisation, as upstream measured every Rust framework. The image build pays for
# it once, and a service built for speed ships this way.
[profile.release]
lto = "fat"
codegen-units = 1

[features]
# container-h2's server, which answers HTTP/2 with prior knowledge. Only its binary turns it on.
container-h2 = ["axum/http2"]
