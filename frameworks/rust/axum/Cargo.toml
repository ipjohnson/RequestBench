[package]
name = "rb-axum"
version = "0.0.0"
edition = "2024"
publish = false
# The application is in Implementation/ and the suite in UnitTests/, so every target names its
# path rather than following cargo's src/ and tests/.
build = "Implementation/build.rs"
autobins = false
autotests = false

# The suite is UnitTests/, so the library and the binary build no test harness of their own.
[lib]
name = "implementation"
path = "Implementation/lib.rs"
test = false
doctest = false

[[bin]]
name = "server"
path = "Implementation/main.rs"
test = false

[[test]]
name = "unit"
path = "UnitTests/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-response-cache = "0.5.0"
# validator 0.20, not 0.21: axum-valid 0.25 implements Valid for validator 0.20's Validate trait.
axum-valid = { version = "0.25.0", default-features = false, features = ["validator", "into_json"] }
askama = "0.16.1"
cached = "1.1.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "fs", "validate-request"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
flate2 = "1.1.10"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Whole-program optimisation, as upstream measured every Rust framework. The image build pays for
# it once, and a service built for speed ships this way.
[profile.release]
lto = "fat"
codegen-units = 1
